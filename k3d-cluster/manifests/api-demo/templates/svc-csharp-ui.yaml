apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.csharp_ui.service.name }}"
  namespace: "{{ .Values.general.namespace }}"
  labels:
    istio.io/use-waypoint: "{{ .Values.csharp_ui.service.name }}-svc-waypoint"
spec:
  ports:
  - name: http
    port: !!int "{{ .Values.csharp_ui.service.port }}"
    protocol: TCP
    targetPort: !!int "{{ .Values.csharp_ui.service.targetPort }}"
  selector:
    app: "{{ .Values.csharp_ui.name }}"
status:
  loadBalancer: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: "{{ .Values.csharp_ui.service.name }}-allow"
  namespace: "{{ .Values.general.namespace }}"
spec:
  selector:
    matchLabels:
      app: "{{ .Values.csharp_ui.name }}"
  action: ALLOW
  rules:
  - to:
    - operation:
        ports:
        - "{{ .Values.csharp_ui.service.port }}"